services:
  bot:
    image: ${BALANS_IMAGE:?Set BALANS_IMAGE}
    env_file: /etc/balans/runtime.env
    restart: unless-stopped
    init: true
    stop_grace_period: 10m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - /opt/balans/shared:/app/.local
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18088:8088"
    networks:
      - balans-backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBHOOK_HOST: 0.0.0.0
      ADMIN_HOST: 0.0.0.0
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  balans-backend:
    external: true
    name: balans-backend
